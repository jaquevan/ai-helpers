base: https://raw.githubusercontent.com/fullsend-ai/agents/1a94080c9c2bcbb5607876f112aa4d3c4286f70b/harness/review.yaml#sha256=9e861368a30eaf326c95fc0bd37cf438e9931048807f40c4bc6afad01c7aea18
agent: agents/review.md

description: "Fullsend review agent with OpenAI Luna"
providers:
  - openai

# The shared review base carries Vertex host files for Claude runs. OpenAI
# runs do not need them, so override those entries as optional.
host_files:
  - src: "${FULLSEND_OPENAI_GCP_ENV_FILE}"
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    optional: true
  - src: "${GOOGLE_APPLICATION_CREDENTIALS}"
    dest: /tmp/.gcp-credentials.json
    optional: true

env:
  sandbox:
    PR_URL: "${PR_URL}"
    REPO_FULL_NAME: "${REPO_FULL_NAME}"
    REVIEW_FINDING_SEVERITY_THRESHOLD: "${REVIEW_FINDING_SEVERITY_THRESHOLD}"
