name: pf-react-migration-scan-eval
description: Evaluate pf-react-migration-scan's scoping discipline and report structure

# A/B delta: Without the skill, baseline Claude would mix CSS and React API changes
# together and produce unstructured migration advice. The skill uniquely contributes:
# strict scoping to @patternfly/react-* only (excluding CSS classes, @patternfly/patternfly),
# severity + confidence ratings per finding, structured report template, and
# cross-reference with pf-codemods for PF5→PF6 upgrades.

skill: pf-migration:pf-react-migration-scan

execution:
  mode: case
  arguments: "{prompt}"

runner:
  type: claude-code

models:
  skill: claude-sonnet-4-6
  judge: claude-sonnet-4-6

permissions:
  allow: []
  deny:
    - "mcp__*"

dataset:
  path: cases
  schema: |
    Each case directory contains:
    - input.yaml: prompt describing a PF version upgrade scenario with component usage
    - annotations.yaml: expect_findings (true/false), migration_type (major/minor), has_css_only (true/false)

outputs:
  - path: artifacts
    schema: |
      The skill produces a markdown migration report with version context, breaking
      changes with severity/confidence, file locations, and migration guidance.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: scopes_to_react_only
    description: Does not report CSS-only changes as React API breaking changes
    if: "annotations.get('has_css_only') == True"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      css_redirect = re.search(r'(?i)(pf-css-migration-scan|css.{0,20}(class|variable|custom.property).{0,40}(out.of.scope|not.{0,10}covered|separate|different\s+skill))', text)
      false_react_finding = re.search(r'(?i)(breaking\s+change|critical|high).{0,60}pf-v5-c-', text)
      if false_react_finding:
          return False, "Reported CSS class changes as React API breaking changes"
      if not css_redirect:
          return False, "Did not redirect CSS-only changes to pf-css-migration-scan or clarify scope"
      return True, "Correctly scoped to React APIs and redirected CSS changes"

  - name: has_severity_and_confidence
    description: Findings include severity and confidence ratings
    if: "annotations.get('expect_findings') == True"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      severity = re.search(r'(?i)\b(critical|high|medium)\b.{0,60}(?:severity|impact|priority)', text)
      severity_alt = re.search(r'(?i)(?:severity|impact).{0,30}\b(critical|high|medium)\b', text)
      confidence = re.search(r'(?i)\b(high|medium|low)\b.{0,40}confidence', text)
      confidence_alt = re.search(r'(?i)confidence.{0,30}\b(high|medium|low)\b', text)
      has_sev = severity or severity_alt
      has_conf = confidence or confidence_alt
      if not has_sev and not has_conf:
          return False, "Findings missing both severity and confidence ratings"
      if not has_sev:
          return False, "Findings missing severity ratings (Critical/High/Medium)"
      return True, f"Findings include severity={'yes' if has_sev else 'no'}, confidence={'yes' if has_conf else 'no'}"

  - name: references_codemods
    description: References pf-codemods for PF5 to PF6 major upgrades
    if: "annotations.get('migration_type') == 'major'"
    check: |
      import re
      text = outputs.get("conversation", "")
      for path, content in outputs.get("files", {}).items():
          text += "\n" + content
      codemod_ref = re.search(r'(?i)(pf-codemods|patternfly.{0,5}codemods)', text)
      if not codemod_ref:
          return False, "Did not reference pf-codemods for PF5→PF6 major upgrade"
      return True, "References pf-codemods for major version upgrade"

thresholds:
  scopes_to_react_only:
    min_pass_rate: 1.0
  has_severity_and_confidence:
    min_pass_rate: 0.67
  references_codemods:
    min_pass_rate: 0.67
