prompt: |
  I just wrote a new custom modal component in my React app. Here's what it looks like:

  ```tsx
  // src/components/CustomDialog.tsx (new file, uncommitted)
  import React from 'react';

  interface CustomDialogProps {
    title: string;
    isOpen: boolean;
    onClose: () => void;
    children: React.ReactNode;
    variant?: 'small' | 'medium' | 'large';
  }

  export const CustomDialog: React.FC<CustomDialogProps> = ({
    title, isOpen, onClose, children, variant = 'medium'
  }) => {
    if (!isOpen) return null;
    return (
      <div className="dialog-overlay" onClick={onClose}>
        <div className={`dialog-content dialog-${variant}`} onClick={e => e.stopPropagation()}>
          <div className="dialog-header">
            <h2>{title}</h2>
            <button onClick={onClose}>×</button>
          </div>
          <div className="dialog-body">{children}</div>
        </div>
      </div>
    );
  };
  ```

  Can you check if PatternFly already has something like this?
