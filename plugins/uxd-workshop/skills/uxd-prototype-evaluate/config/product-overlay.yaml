# Product Overlay — defaults for uxd-prototype-evaluate
# Checked-in template. Keep values generic (example.com / empty).
#
# Team-specific URLs (Langfuse, internal git remotes, Pages, Jira) live in
# internal-ai-helpers plugin uxd-eval-config (auto-discovered). Optional:
#   1. config/product-overlay.local.yaml (gitignored personal override), OR
#   2. EVAL_OVERLAY_PATH / UXD_INTERNAL_HELPERS
# Env vars (LANGFUSE_HOST, …) still win.
# See references/skill-overlays.md.

product:
  name: "Product"
  short_name: "product"
  version: "main"

# Jira configuration — maps project key prefixes to instance URLs
jira:
  instances:
    - prefix: "PROJ-"
      url: "https://issues.example.com/browse/"
      type: "story"
  outcome_project: ""
  outcome_issue_type: "Outcome"
  ac_location: "description"  # field where acceptance criteria live in the ticket
  ticket_label: "Ticket"      # breadcrumb label for the evaluated issue

# Git configuration — prototype repo conventions
git:
  base_branch: "main"
  remote_url: ""
  local_workspace: ""
  pages_base_url: ""
  mr_branch_pattern: "mr-{number}"
  mr_url_style: "gitlab"      # gitlab | github — how MR/PR links are built
  diff_url_template: ""

# Optional context git remotes.
# The checker is a required local sibling skill, not a context repository.
# usability_testing: empty = skip bootstrap (pipeline degrades).
# Override with USABILITY_TESTING_REPO.
context_repos:
  usability_testing: ""

# Langfuse tracking (opt-in). Credentials remain environment-only.
langfuse:
  host: ""

# Report publish / hosted dashboard (used by publish-report.sh and the HTML header)
publish:
  gitlab_pages_repo: ""
  pages_base_url: ""
  jira_base_url: "https://issues.example.com/browse"
  dashboard_url: ""

# Design system — PatternFly configuration for consistency checks
# Paths are skill-relative (resolved from CLAUDE_SKILL_DIR / EVAL_ROOT).
design_system:
  name: "PatternFly 6"
  context_path: "../uxd-consistency-check/"
  guidelines_path: "../uxd-consistency-check/guidelines/"
  analyze_script: "../uxd-consistency-check/scripts/analyze.py"

# Personas — canonical catalogs live in the plugin; deep behavioral YAML from .context/usability-testing/
personas:
  catalog_path: "${CLAUDE_PLUGIN_ROOT}/knowledge/personas/catalog.yaml"
  cards_path: "${CLAUDE_PLUGIN_ROOT}/knowledge/personas/"
  overlays_catalog_path: "${CLAUDE_PLUGIN_ROOT}/knowledge/personas/overlays/catalog.yaml"
  overlays_path: "${CLAUDE_PLUGIN_ROOT}/knowledge/personas/overlays/"
  context_path: ".context/usability-testing/personas/"
  rubric_path: ".context/usability-testing/prompts/evaluate-flow.md"
  # Leave empty to use catalog.yaml defaults.pair
  default_pair: []

# Navigation conventions — adjust to the target prototype codebase
navigation:
  sidebar_file: ""
  routes_file: ""
  feature_flags_file: ""

# Known MR mapping — optional static map of Jira keys to MR numbers
known_mrs: {}

# Google Sheet integration (optional — leave sheet_id empty to disable)
tracking:
  sheet_id: ""
  sheet_name: "Automated Eval"
