<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ — Canvas</title>
<link rel="stylesheet" href="./viewer.css">
</head>
<body class="__BODY_CLASS__">

<div class="toolbar" id="toolbar">
  <span class="toolbar-title" id="canvas-title"></span>

  <div class="toolbar-group">
    <div class="dropdown" id="theme-dropdown">
      <button class="toolbar-btn" id="theme-toggle">
        <span class="theme-swatch" id="theme-swatch"></span>
        <span id="theme-name">Graph Paper</span>
      </button>
      <div class="dropdown-menu" id="theme-menu"></div>
    </div>

    <div class="dropdown" id="grid-dropdown">
      <button class="toolbar-btn" id="grid-toggle">
        <span id="grid-name">Lines</span>
      </button>
      <div class="dropdown-menu" id="grid-menu"></div>
    </div>

    <div class="dropdown" id="device-dropdown">
      <button class="toolbar-btn" id="device-toggle">
        <span id="device-name">Mouse</span>
      </button>
      <div class="dropdown-menu" id="device-menu"></div>
    </div>
  </div>

  <div class="toolbar-divider"></div>

  <div class="toolbar-group">
    <button class="toolbar-btn" id="zoom-out" title="Zoom out">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="11" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4.5" y1="7" x2="9.5" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <span class="zoom-display" id="zoom-display">100%</span>
    <button class="toolbar-btn" id="zoom-in" title="Zoom in">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="11" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="4.5" y1="7" x2="9.5" y2="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="4.5" x2="7" y2="9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button class="toolbar-btn" id="zoom-reset" title="Reset view">
      <svg viewBox="0 0 16 16"><path d="M2 2h5v2H4v3H2V2zm7 0h5v5h-2V4H9V2zM2 9h2v3h3v2H2V9zm12 0v5H9v-2h3V9h2z" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<div class="canvas-wrap" id="canvas-wrap">
  <div class="grid-layer" id="grid-layer"></div>
  <div class="transform-layer" id="transform-layer"></div>
  <div class="status-bar" id="status-bar"></div>
</div>

<script src="./viewer.js"></script>
</body>
</html>
